<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scroll-Controlled Video Background</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 200vh; /* Extra height to allow scrolling */
            overflow-x: hidden;
        }

        .video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
        }

        video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            object-fit: cover;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
        }

        .content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        h1 {
            font-size: 3rem;
        }

        .scroll-content {
            height: 150vh; /* More scrolling space */
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="video-container">
        <video id="bgVideo" autoplay muted loop>
            <source src="experiment1.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <div class="overlay"></div>
    </div>

    <div class="content">
        <h1>Scroll to Control the Video</h1>
    </div>

    <div class="scroll-content">
        Scroll down to play, scroll up to reverse!
    </div>

    <script>
        let video = document.getElementById("bgVideo");
        let lastScrollY = window.scrollY;

        window.addEventListener("scroll", function () {
            let currentScrollY = window.scrollY;
            
            if (currentScrollY > lastScrollY) {
                video.playbackRate = 1; // Normal forward play
            } else {
                video.playbackRate = -1; // Reverse play
            }

            lastScrollY = currentScrollY;
        });
    </script>

</body>
</html>
